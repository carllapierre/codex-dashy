services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            CODEX_USAGE_BRIDGE_URL: ${CODEX_USAGE_BRIDGE_URL:-http://host.docker.internal:8790}
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${HOST_PORT:-8789}:8789'
        volumes:
            - ./data:/app/data
        stop_grace_period: 30s
        restart: unless-stopped
