<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title description">
    <title id="title">Codex Dashy</title>
    <desc id="description">Local Codex telemetry dashboard banner</desc>
    <defs>
        <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 55) rotate(32) scale(680 430)">
            <stop stop-color="#925CFF" stop-opacity="0.24" />
            <stop offset="1" stop-color="#925CFF" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="lavender-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1450 370) rotate(-145) scale(520 350)">
            <stop stop-color="#BA98FF" stop-opacity="0.14" />
            <stop offset="1" stop-color="#BA98FF" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="chart-line" x1="1048" y1="294" x2="1450" y2="164" gradientUnits="userSpaceOnUse">
            <stop stop-color="#925CFF" />
            <stop offset="1" stop-color="#BA98FF" />
        </linearGradient>
    </defs>

    <rect width="1600" height="420" fill="#080C23" />
    <rect width="1600" height="420" fill="url(#violet-glow)" />
    <rect width="1600" height="420" fill="url(#lavender-glow)" />

    <g opacity="0.16" stroke="#BA98FF" stroke-width="1">
        <path d="M0 350H1600" />
        <path d="M0 286H1600" />
        <path d="M0 222H1600" />
        <path d="M0 158H1600" />
        <path d="M420 0V420" />
        <path d="M820 0V420" />
        <path d="M1220 0V420" />
    </g>

    <rect x="28" y="28" width="1544" height="364" rx="20" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.08" />

    <g transform="translate(88 92)">
        <rect width="68" height="68" rx="14" fill="#925CFF" />
        <path d="m20 22 14 12-14 12M39 46h18" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" />
    </g>

    <text x="88" y="230" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5">Codex Dashy</text>
    <text x="92" y="278" fill="#B3B6BA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="400" letter-spacing="0.2">Local Codex telemetry, with a clear view of every conversation.</text>
    <text x="92" y="330" fill="#BA98FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2.6">TOKEN USAGE  /  ESTIMATED COST  /  CONVERSATION DETAIL</text>

    <g transform="translate(1016 76)">
        <rect width="468" height="268" rx="16" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.08" />
        <text x="28" y="42" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">GLOBAL OVERVIEW</text>
        <text x="28" y="70" fill="#6B7280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="1.4">TOKEN ACTIVITY</text>

        <g opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.08">
            <path d="M28 104H440" />
            <path d="M28 154H440" />
            <path d="M28 204H440" />
        </g>

        <path d="M30 236 78 216 112 224 154 182 194 198 232 162 278 177 316 136 354 148 398 106 438 118" fill="none" stroke="url(#chart-line)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
        <circle cx="438" cy="118" r="6" fill="#BA98FF" />

        <rect x="28" y="238" width="112" height="8" rx="4" fill="#925CFF" fill-opacity="0.24" />
        <rect x="150" y="238" width="82" height="8" rx="4" fill="#BA98FF" fill-opacity="0.28" />
        <rect x="242" y="238" width="146" height="8" rx="4" fill="#925CFF" fill-opacity="0.18" />
    </g>
</svg>
